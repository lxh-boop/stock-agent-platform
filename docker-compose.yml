name: stock_daily_app

services:
  api:
    image: stock-daily-app-api:stage6-5
    build:
      context: .
      dockerfile: Dockerfile.compose
      target: api
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    init: true
    restart: unless-stopped
    environment:
      AGENT_API_HOST: 0.0.0.0
      AGENT_API_PORT: "8010"
      STOCK_APP_DEPLOYMENT_MODE: compose-react
      STOCK_APP_ENV: ${STOCK_APP_ENV:-development}
      STOCK_APP_SECRET_DIR: /app_secrets
      STOCK_APP_READINESS_CACHE_SECONDS: ${STOCK_APP_READINESS_CACHE_SECONDS:-5}
      STOCK_APP_RUNTIME_SCHEDULER_ENABLED: "${STOCK_APP_RUNTIME_SCHEDULER_ENABLED:-1}"
      TZ: Asia/Shanghai
      STOCK_AGENT_RECOVER_INTERRUPTED_ON_START: "1"
      STOCK_POSTGRES_HOST: ${STOCK_POSTGRES_HOST:-postgres}
      STOCK_POSTGRES_PORT: ${STOCK_POSTGRES_PORT:-5432}
      STOCK_POSTGRES_DB: ${STOCK_POSTGRES_DB:-stock_daily_app}
      STOCK_POSTGRES_USER: ${STOCK_POSTGRES_USER:-stock_app}
      STOCK_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      STOCK_POSTGRES_SCHEMA: ${STOCK_POSTGRES_SCHEMA:-stock_app}
      STOCK_POSTGRES_RUNTIME_SCHEMA: ${STOCK_POSTGRES_RUNTIME_SCHEMA:-stock_runtime}
      STOCK_AGENT_MAX_CONCURRENT_TASKS: ${STOCK_AGENT_MAX_CONCURRENT_TASKS:-4}
      STOCK_AGENT_CORS_ORIGINS: ${STOCK_AGENT_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      STOCK_LOCAL_LLM_BASE_URL: ${STOCK_LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      NEO4J_URI: ${NEO4J_URI:-bolt://host.docker.internal:7687}
      QLIB_PROVIDER_URI: ${QLIB_PROVIDER_URI:-/app/data/qlib}
      PYTHONUNBUFFERED: "1"
      AGENT_FLOW_TRACE: ${AGENT_FLOW_TRACE:-1}
      AGENT_FLOW_TRACE_MAX_CHARS: ${AGENT_FLOW_TRACE_MAX_CHARS:-30000}
      AGENT_CONSOLE_TRACE: ${AGENT_CONSOLE_TRACE:-0}
      STOCK_LLM_PROMPT_DUMP_DIR: /app_runtime/llm_prompt_dumps

      WATCHFILES_FORCE_POLLING: "true"
      AGENT_RUN_LOG_DIR: /app_run_logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STOCK_APP_API_PORT:-8010}:8010"
    volumes:
#      - type: bind
#        source: ./data
#        target: /app/data
#      - type: bind
#        source: ./models
#        target: /app/models
#      - type: bind
#        source: ./outputs
#        target: /app/outputs
#      - type: bind
#        source: ./logs
#        target: /app/logs
#      - type: bind
#        source: ./external_repos
#        target: /app/external_repos
#      - type: bind
#        source: ./local_app_config.json
#        target: /app/local_app_config.json
      - type: bind
        source: .
        target: /app
      - type: volume
        source: app_secrets
        target: /app_secrets
      - type: bind
        source: ${STOCK_POSTGRES_SECRET_FILE:-D:/google/postgres_final/postgres_password.txt}
        target: /run/secrets/postgres_password
        read_only: true
      - type: bind
        source: ${STOCK_LLM_PROMPT_DUMP_HOST_DIR:-D:/google/llm_prompt_dumps}
        target: /app_runtime/llm_prompt_dumps
      - type: bind
        source: "${AGENT_RUN_LOG_HOST_DIR:-D:/stock_daily_app/outputs/agent_runs}"
        target: /app_run_logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8010/api/v1/readiness', timeout=5)); assert p.get('success') and (p.get('data') or {}).get('status') == 'ready'"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 90s
    stop_grace_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${STOCK_POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${STOCK_POSTGRES_DB:-stock_daily_app}
      POSTGRES_USER: ${STOCK_POSTGRES_USER:-stock_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: Asia/Shanghai
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
      - type: bind
        source: ${STOCK_POSTGRES_SECRET_FILE:-D:/google/postgres_final/postgres_password.txt}
        target: /run/secrets/postgres_password
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STOCK_POSTGRES_USER:-stock_app} -d ${STOCK_POSTGRES_DB:-stock_daily_app}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  frontend:
    image: stock-daily-app-frontend:stage6-5
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STOCK_APP_WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 10s

volumes:
  postgres_data: {name: stock_daily_app_postgres}
  app_secrets: {name: stock_daily_app_secrets}
