name: stock_daily_app

services:
  api:
    image: stock-daily-app-api:stage6-5
    build:
      context: .
      dockerfile: Dockerfile.compose
      target: api
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    init: true
    restart: unless-stopped
    environment:
      AGENT_API_HOST: 0.0.0.0
      AGENT_API_PORT: "8010"
      STOCK_APP_DEPLOYMENT_MODE: compose-react
      STOCK_APP_RUNTIME_SCHEDULER_ENABLED: "1"
      TZ: Asia/Shanghai
      STOCK_AGENT_TASK_DB: /app/runtime/task_runtime.sqlite3
      STOCK_AGENT_RECOVER_INTERRUPTED_ON_START: "1"
      STOCK_AGENT_MAX_CONCURRENT_TASKS: ${STOCK_AGENT_MAX_CONCURRENT_TASKS:-4}
      STOCK_AGENT_CORS_ORIGINS: ${STOCK_AGENT_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      STOCK_LOCAL_LLM_BASE_URL: ${STOCK_LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      NEO4J_URI: ${NEO4J_URI:-bolt://host.docker.internal:7687}
      QLIB_PROVIDER_URI: ${QLIB_PROVIDER_URI:-/app/data/qlib}
      KRONOS_LAB_ROOT: /kronos_model_lab
      KRONOS_MODEL_DIR: /kronos_model_lab/outputs/target_mode/target_full_recent_v1/model
      KRONOS_PREDICTOR_DIR: /kronos_model_lab/models/pretrained/Kronos-mini
      KRONOS_TOKENIZER_DIR: /kronos_model_lab/models/pretrained/Kronos-Tokenizer-2k
      PYTHONUNBUFFERED: "1"
      AGENT_FLOW_TRACE: ${AGENT_FLOW_TRACE:-1}
      AGENT_FLOW_TRACE_MAX_CHARS: ${AGENT_FLOW_TRACE_MAX_CHARS:-30000}
      AGENT_CONSOLE_TRACE: ${AGENT_CONSOLE_TRACE:-0}
      STOCK_LLM_PROMPT_DUMP_DIR: /app_runtime/llm_prompt_dumps

      WATCHFILES_FORCE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STOCK_APP_API_PORT:-8010}:8010"
    volumes:
#      - type: bind
#        source: ./data
#        target: /app/data
#      - type: bind
#        source: ./models
#        target: /app/models
#      - type: bind
#        source: ./outputs
#        target: /app/outputs
#      - type: bind
#        source: ./logs
#        target: /app/logs
#      - type: bind
#        source: ./runtime
#        target: /app/runtime
#      - type: bind
#        source: ./external_repos
#        target: /app/external_repos
#      - type: bind
#        source: ./local_app_config.json
#        target: /app/local_app_config.json
      - type: bind
        source: .
        target: /app
      # High-frequency SQLite WAL must live on the Linux filesystem.
      # Mounting /app/runtime separately shadows the runtime directory from
      # the Windows project bind mount and prevents cross-filesystem WAL issues.
      - type: volume
        source: task_runtime_data
        target: /app/runtime
      - type: bind
        source: ${STOCK_LLM_PROMPT_DUMP_HOST_DIR:-D:/google/llm_prompt_dumps}
        target: /app_runtime/llm_prompt_dumps
      - type: bind
        source: ${KRONOS_LAB_HOST_DIR:-D:/google/kronos_model_lab}
        target: /kronos_model_lab
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8010/api/v1/health', timeout=5)); assert p.get('success') and (p.get('data') or {}).get('status') == 'ok'"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 90s
    stop_grace_period: 30s

  frontend:
    image: stock-daily-app-frontend:stage6-5
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STOCK_APP_WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 10s

volumes:
  task_runtime_data: {name: stock_daily_app_task_runtime}
