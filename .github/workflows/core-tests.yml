name: 核心质量检查

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 核心质量检查-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-core:
    name: 后端编译与引擎单测
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖（引擎子集）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "psycopg[binary]>=3.2,<4" "neo4j>=6,<7" "mcp>=2,<3" pandas numpy pydantic requests pyyaml jsonschema "langchain>=1.0,<2" "langchain-openai>=1.0,<2" "langgraph>=1.0,<2" "langgraph-checkpoint-postgres>=2.0,<4"

      - name: 编译检查
        run: python -m compileall -q agent_graph application server core database rag portfolio pipelines strategies scheduler tools

      - name: 引擎与写路径单测（离线）
        run: >-
          python -m pytest -q
          tests/unit/test_agent_graph_engine.py
          tests/unit/test_agent_graph_writes.py

  frontend-quality:
    name: 前端类型、单测与生产构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 固定 npm 版本
        run: npm install --global npm@10.9.2

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: 类型检查
        run: npm run typecheck

      - name: 运行前端单测
        run: npm test

      - name: 构建生产前端
        run: npm run build
