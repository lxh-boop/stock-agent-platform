name: Personal daily isolation
on:
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stock_app
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: stock_test_isolation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stock_app -d stock_test_isolation"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STOCK_POSTGRES_HOST: 127.0.0.1
      STOCK_POSTGRES_USER: stock_app
      STOCK_POSTGRES_PASSWORD: test-only-password
      STOCK_POSTGRES_DB: stock_test_isolation
      STOCK_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pandas numpy pydantic requests pyyaml jsonschema cryptography fastapi httpx 'psycopg[binary]>=3.2,<4'
      - run: python -m pytest -q tests/unit/test_personal_daily_isolation.py tests/unit/test_account_scoped_credentials.py tests/unit/test_scheduler_trading_calendar.py tests/unit/test_scheduler_job_state.py tests/unit/test_scheduler_job_lock.py
      - run: python -m pytest -q tests/integration/test_account_datasets_postgres.py
