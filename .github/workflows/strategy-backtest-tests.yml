name: Strategy research migration
on:
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stock_app
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: stock_test_isolation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stock_app -d stock_test_isolation"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STOCK_POSTGRES_HOST: 127.0.0.1
      STOCK_POSTGRES_USER: stock_app
      STOCK_POSTGRES_PASSWORD: test-only-password
      STOCK_POSTGRES_DB: stock_test_isolation
      STOCK_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pandas numpy pydantic requests pyyaml jsonschema cryptography fastapi httpx 'psycopg[binary]>=3.2,<4' 'langchain>=1,<2' 'langchain-openai>=1,<2' 'langgraph>=1,<2' 'langgraph-checkpoint-postgres>=2,<4' 'neo4j>=6,<7' 'mcp>=2,<3'
      - run: python -m compileall -q backtesting application server agent_graph
      - run: python -m pytest -q tests/unit/test_strategy_engine.py tests/unit/test_strategy_research.py tests/unit/test_strategy_backtest_api.py tests/unit/test_strategy_backtest_tools.py tests/unit/test_agent_graph_engine.py tests/unit/test_agent_graph_writes.py
      - run: python -m pytest -q tests/integration/test_strategy_backtest_postgres.py tests/integration/test_alpha158_postgres.py tests/integration/test_account_datasets_postgres.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend typecheck, tests and build
        working-directory: frontend
        run: |
          npm install --global npm@10.9.2
          npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
          npm run typecheck
          npm test
          npm run build
      - name: Chromium interactions with offline API fixtures
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          (cd frontend && npm run preview > /tmp/backtest-preview.log 2>&1) &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          BACKTEST_BROWSER_URL=http://127.0.0.1:4173 python -m pytest -q tests/browser/test_strategy_research_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-research-browser
          path: browser-results/
          if-no-files-found: ignore
          retention-days: 3
