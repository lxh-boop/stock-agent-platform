name: Validate and publish complete strategy migration
on:
  push:
    branches: [chatgpt]
    paths: ['.github/research-port/**', '.github/workflows/apply-research-port.yml']
permissions:
  contents: write
concurrency:
  group: publish-complete-research
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stock_app
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: stock_test_isolation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stock_app -d stock_test_isolation"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STOCK_POSTGRES_HOST: 127.0.0.1
      STOCK_POSTGRES_USER: stock_app
      STOCK_POSTGRES_PASSWORD: test-only-password
      STOCK_POSTGRES_DB: stock_test_isolation
      STOCK_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed patch and apply source
        id: source
        run: |
          set -euo pipefail
          mkdir -p validation-results
          git merge-base --is-ancestor 2376deb21b0fb44a5c4b8f3f59ff86999626ad98 HEAD
          python - <<'PY'
          import bz2, hashlib, os
          from pathlib import Path
          raw = b''.join(Path(f'.github/research-port/part{i}.bin').read_bytes() for i in range(20))
          patch = bz2.decompress(raw)
          assert hashlib.sha256(patch).hexdigest() == '7d58d151cbaaa968bf44e62586d6d8c189f687ea94f377d64f83db0977f79d1f'
          Path(os.environ['RUNNER_TEMP'], 'migration.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/migration.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/migration.patch"
          python - <<'PY'
          import ast, re
          from pathlib import Path
          path = Path('agent_graph/services/strategy_implementation_service.py')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines(keepends=True)
          funcs = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.FunctionDef) and n.name == '_build_backtest_bundle']
          for node in funcs:
              body = ''.join(lines[node.lineno-1:node.end_lineno])
              if '"status": "blocked"' not in body:
                  raise RuntimeError('Strategy preview must not claim an unexecuted backtest passed')
              fixed, count = re.subn(r'("baseline_config"\s*:\s*)baseline_config\b', r'\1raw_config', body)
              if count:
                  assert 'raw_config =' in body
                  lines[node.lineno-1:node.end_lineno] = [fixed]
          path.write_text(''.join(lines), encoding='utf-8')
          fixture = '''"""Database integration tests share one initialization in a local temporary database only."""
          import os
          from pathlib import Path
          import pytest

          @pytest.fixture(scope="session")
          def isolated_postgres_schema():
              if os.environ.get("STOCK_TEST_DATABASE") != "1":
                  pytest.skip("requires isolated test database")
              psycopg = pytest.importorskip("psycopg")
              from database.postgres_config import PostgresSettings
              settings = PostgresSettings.from_env()
              if settings.database != "stock_test_isolation" or settings.host not in {"127.0.0.1", "localhost", "::1"}:
                  raise RuntimeError("Refuse non-local or non-test database")
              path = Path(__file__).resolve().parents[2] / "database/postgres_migrations/001_baseline.sql"
              script = "\\n".join(line for line in path.read_text(encoding="utf-8").splitlines() if not line.startswith("\\\\"))
              with psycopg.connect(**settings.connection_kwargs()) as conn:
                  conn.execute(script)
              yield
          '''
          path = Path('tests/integration/conftest.py')
          assert not path.exists(), 'Do not overwrite an existing test fixture'
          path.write_text(fixture, encoding='utf-8')
          ast.parse(fixture)
          for filename, name, auth in [('test_strategy_backtest_postgres.py','schema',False),('test_alpha158_postgres.py','schema',False),('test_account_datasets_postgres.py','initialize_schema',True)]:
              path = Path('tests/integration') / filename
              source = path.read_text(encoding='utf-8')
              lines = source.splitlines(keepends=True)
              nodes = [n for n in ast.parse(source).body if isinstance(n, ast.FunctionDef) and n.name == name]
              assert len(nodes) == 1
              node = nodes[0]
              replacement = f'def {name}(isolated_postgres_schema):\n'
              if auth:
                  replacement += '    from database.auth_schema import ensure_auth_schema\n    ensure_auth_schema()\n'
              replacement += '    yield\n'
              lines[node.lineno-1:node.end_lineno] = [replacement]
              path.write_text(''.join(lines), encoding='utf-8')
              ast.parse(path.read_text(encoding='utf-8'))
          path = Path('.github/workflows/strategy-backtest-tests.yml')
          source = path.read_text(encoding='utf-8')
          source = source.replace('runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04')
          source = source.replace('tests/integration/test_strategy_backtest_postgres.py\n', 'tests/integration/test_strategy_backtest_postgres.py tests/integration/test_alpha158_postgres.py tests/integration/test_account_datasets_postgres.py\n')
          path.write_text(source, encoding='utf-8')
          print('Shared initialization fixed; no business assertions removed')
          PY
          git add agent_graph/services/strategy_implementation_service.py tests/integration .github/workflows/strategy-backtest-tests.yml
          git diff --cached --check
          git diff --cached --stat | tee validation-results/changes.txt
      - name: Install offline test dependencies
        run: python -m pip install -q pytest pandas numpy pydantic requests pyyaml jsonschema cryptography fastapi httpx 'psycopg[binary]>=3.2,<4' 'langchain>=1,<2' 'langchain-openai>=1,<2' 'langgraph>=1,<2' 'langgraph-checkpoint-postgres>=2,<4' 'neo4j>=6,<7' 'mcp>=2,<3'
      - name: Compile Python
        run: python -m compileall -q backtesting application server core database agent_graph
      - name: Research, Agent approval and existing daily regressions
        run: |
          set -euo pipefail
          python -m pytest -q --disable-warnings --junitxml=validation-results/unit.xml tests/unit/test_strategy_engine.py tests/unit/test_strategy_research.py tests/unit/test_strategy_backtest_api.py tests/unit/test_strategy_backtest_tools.py tests/unit/test_agent_graph_engine.py tests/unit/test_agent_graph_writes.py tests/unit/test_personal_daily_isolation.py tests/unit/test_account_scoped_credentials.py tests/unit/test_scheduler_trading_calendar.py tests/unit/test_scheduler_job_state.py tests/unit/test_scheduler_job_lock.py tests/unit/test_alpha158_storage.py | tee validation-results/unit.txt
      - name: Real PostgreSQL research, factor retention and account isolation
        run: |
          set -euo pipefail
          python -m pytest -q --disable-warnings --junitxml=validation-results/postgres.xml tests/integration/test_strategy_backtest_postgres.py tests/integration/test_alpha158_postgres.py tests/integration/test_account_datasets_postgres.py | tee validation-results/postgres.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend types, tests and production build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
          npm run typecheck 2>&1 | tee ../validation-results/frontend-types.txt
          npm test 2>&1 | tee ../validation-results/frontend-tests.txt
          npm run build 2>&1 | tee ../validation-results/frontend-build.txt
      - name: Chromium page interactions using offline API fixtures
        run: |
          set -euo pipefail
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
          (cd frontend && npm run preview > /tmp/backtest-preview.log 2>&1) &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          BACKTEST_BROWSER_URL=http://127.0.0.1:4173 python -m pytest -q --junitxml=validation-results/browser.xml tests/browser/test_strategy_research_browser.py | tee validation-results/browser.txt
      - name: Require executed tests, not skipped acceptance gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          rows = []
          for name in ('unit', 'postgres', 'browser'):
              suites = list(ET.parse(f'validation-results/{name}.xml').getroot().iter('testsuite'))
              counts = {k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
              assert counts['tests'] > 0 and not any(counts[k] for k in ('failures','errors','skipped')), counts
              rows.append(f'{name}: {counts}')
          Path('validation-results/summary.txt').write_text('\n'.join(rows), encoding='utf-8')
          print('\n'.join(rows))
          PY
      - name: Publish only validated source to chatgpt, never main
        run: |
          git fetch origin chatgpt
          test "$(git rev-parse origin/chatgpt)" = "$GITHUB_SHA"
          git rm -r .github/research-port .github/workflows/apply-research-port.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'feat!: replace legacy backtests with complete account-scoped strategy research'
          git push origin HEAD:refs/heads/chatgpt
          git rev-parse HEAD > "$RUNNER_TEMP/REVISION.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
          echo "Published tested revision $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          cat validation-results/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source for failed-test diagnosis without publishing it
        if: failure()
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" "$(git write-tree)"
          echo 'UNPUBLISHED: tests did not all pass' > "$RUNNER_TEMP/REVISION.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-research-validation
          path: |
            browser-results/
            validation-results/
            /tmp/backtest-preview.log
            ${{ runner.temp }}/REVISION.txt
            ${{ runner.temp }}/source.tar.gz
          if-no-files-found: error
          retention-days: 7
