name: Validate and publish complete strategy migration
on:
  push:
    branches: [chatgpt]
    paths: ['.github/research-port/**', '.github/workflows/apply-research-port.yml']
permissions:
  contents: write
concurrency:
  group: publish-complete-research
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stock_app
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: stock_test_isolation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stock_app -d stock_test_isolation"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STOCK_POSTGRES_HOST: 127.0.0.1
      STOCK_POSTGRES_USER: stock_app
      STOCK_POSTGRES_PASSWORD: test-only-password
      STOCK_POSTGRES_DB: stock_test_isolation
      STOCK_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed patch and apply source
        run: |
          git merge-base --is-ancestor 2376deb21b0fb44a5c4b8f3f59ff86999626ad98 HEAD
          python - <<'PY'
          import bz2, hashlib, os
          from pathlib import Path
          raw = b''.join(Path(f'.github/research-port/part{i}.bin').read_bytes() for i in range(20))
          patch = bz2.decompress(raw)
          assert hashlib.sha256(patch).hexdigest() == '7d58d151cbaaa968bf44e62586d6d8c189f687ea94f377d64f83db0977f79d1f'
          Path(os.environ['RUNNER_TEMP'], 'migration.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/migration.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/migration.patch"
          python - <<'PY'
          import ast, re
          from pathlib import Path
          path = Path('agent_graph/services/strategy_implementation_service.py')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines(keepends=True)
          funcs = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.FunctionDef) and n.name == '_build_backtest_bundle']
          for node in funcs:
              body = ''.join(lines[node.lineno-1:node.end_lineno])
              if '"status": "blocked"' not in body:
                  raise RuntimeError('Strategy preview must not claim an unexecuted backtest passed')
              fixed, count = re.subn(r'("baseline_config"\s*:\s*)baseline_config\b', r'\1raw_config', body)
              if count:
                  assert 'raw_config =' in body
                  lines[node.lineno-1:node.end_lineno] = [fixed]
          path.write_text(''.join(lines), encoding='utf-8')
          ast.parse(path.read_text(encoding='utf-8'))
          path = Path('backtesting/store.py')
          source = path.read_text(encoding='utf-8')
          source, fixed = re.subn(r'''raise ValueError\((['"])strategy_owner_mismatch\1\)''', "raise KeyError('strategy_not_found')", source)
          path.write_text(source, encoding='utf-8')
          ast.parse(source)
          print(f'Strategy preview validated; cross-owner not-found fixes: {fixed}')
          PY
          git add agent_graph/services/strategy_implementation_service.py backtesting/store.py
          git diff --cached --stat
      - name: Install offline test dependencies
        run: python -m pip install pytest pandas numpy pydantic requests pyyaml jsonschema cryptography fastapi httpx 'psycopg[binary]>=3.2,<4' 'langchain>=1,<2' 'langchain-openai>=1,<2' 'langgraph>=1,<2' 'langgraph-checkpoint-postgres>=2,<4' 'neo4j>=6,<7' 'mcp>=2,<3'
      - name: Compile Python
        run: python -m compileall -q backtesting application server core database agent_graph
      - name: Research, Agent approval and existing daily regressions
        run: >-
          python -m pytest -q --disable-warnings
          tests/unit/test_strategy_engine.py tests/unit/test_strategy_research.py
          tests/unit/test_strategy_backtest_api.py tests/unit/test_strategy_backtest_tools.py
          tests/unit/test_agent_graph_engine.py tests/unit/test_agent_graph_writes.py
          tests/unit/test_personal_daily_isolation.py tests/unit/test_account_scoped_credentials.py
          tests/unit/test_scheduler_trading_calendar.py tests/unit/test_scheduler_job_state.py
          tests/unit/test_scheduler_job_lock.py tests/unit/test_alpha158_storage.py
      - name: Real PostgreSQL research, factor retention and account isolation
        run: >-
          python -m pytest -q --disable-warnings
          tests/integration/test_strategy_backtest_postgres.py
          tests/integration/test_alpha158_postgres.py
          tests/integration/test_account_datasets_postgres.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend types, tests and production build
        working-directory: frontend
        run: |
          npm install --global npm@10.9.2
          npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
          npm run typecheck
          npm test
          npm run build
      - name: Chromium page interactions using offline API fixtures
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          (cd frontend && npm run preview > /tmp/backtest-preview.log 2>&1) &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          BACKTEST_BROWSER_URL=http://127.0.0.1:4173 python -m pytest -q tests/browser/test_strategy_research_browser.py
      - name: Publish only validated source to chatgpt, never main
        run: |
          git fetch origin chatgpt
          test "$(git rev-parse origin/chatgpt)" = "$GITHUB_SHA"
          git rm -r .github/research-port .github/workflows/apply-research-port.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'feat!: replace legacy backtests with complete account-scoped strategy research'
          git push origin HEAD:refs/heads/chatgpt
          git rev-parse HEAD > "$RUNNER_TEMP/REVISION.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
          echo "Published tested revision $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source for failed-test diagnosis without publishing it
        if: failure()
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" "$(git write-tree)"
          echo 'UNPUBLISHED: tests did not all pass' > "$RUNNER_TEMP/REVISION.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-research-validation
          path: |
            browser-results/
            /tmp/backtest-preview.log
            ${{ runner.temp }}/REVISION.txt
            ${{ runner.temp }}/source.tar.gz
          if-no-files-found: ignore
          retention-days: 3
