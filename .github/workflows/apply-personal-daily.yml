name: Validate and publish personal daily isolation
on:
  push:
    branches: [chatgpt]
    paths: ['.github/personal-daily-*.bin', '.github/workflows/apply-personal-daily.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: personal-daily-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'lxh-boop/stock-agent-platform' && github.ref == 'refs/heads/chatgpt'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stock_app
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: stock_test_isolation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stock_app -d stock_test_isolation"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STOCK_POSTGRES_HOST: 127.0.0.1
      STOCK_POSTGRES_PORT: '5432'
      STOCK_POSTGRES_USER: stock_app
      STOCK_POSTGRES_PASSWORD: test-only-password
      STOCK_POSTGRES_DB: stock_test_isolation
      STOCK_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply reviewed source patch
        run: |
          git merge-base --is-ancestor b6686088087af1377cd5fd089431c21aafecb503 HEAD
          python - <<'PY'
          import bz2, hashlib, os
          from pathlib import Path
          parts = ['11', '12', '13', '2', '3']
          raw = b''.join(Path(f'.github/personal-daily-part{p}.bin').read_bytes() for p in parts)
          patch = bz2.decompress(raw)
          assert hashlib.sha256(patch).hexdigest() == 'ba2fd02c789ce3477cc39db78876bcf846093a0f7bbb2ce93dcc33d605f68580'
          Path(os.environ['RUNNER_TEMP'], 'personal-daily.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/personal-daily.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/personal-daily.patch"
          git diff --cached --stat
      - name: Install offline test dependencies
        run: >-
          python -m pip install pytest 'cryptography>=43,<47' 'psycopg[binary]>=3.2,<4'
          'neo4j>=6,<7' 'mcp>=2,<3' pandas numpy pydantic requests pyyaml jsonschema
          'langchain>=1.0,<2' 'langchain-openai>=1.0,<2' 'langgraph>=1.0,<2'
          'langgraph-checkpoint-postgres>=2.0,<4' fastapi httpx apscheduler
      - name: Compile Python source
        run: python -m compileall -q agent_graph application server core database rag portfolio pipelines strategies scheduler tools
      - name: Core and account isolation regression tests
        run: >-
          python -m pytest -q
          tests/unit/test_agent_graph_engine.py tests/unit/test_agent_graph_writes.py
          tests/unit/test_personal_daily_isolation.py tests/unit/test_account_scoped_credentials.py
          tests/unit/test_scheduler_trading_calendar.py tests/unit/test_scheduler_job_state.py
          tests/unit/test_scheduler_job_lock.py
      - name: Real PostgreSQL isolation tests - temporary database only
        run: python -m pytest -q tests/integration/test_account_datasets_postgres.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend typecheck, tests and production build
        working-directory: frontend
        run: |
          npm install --global npm@10.9.2
          npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
          npm run typecheck
          npm test
          npm run build
      - name: Publish tested source to chatgpt - no force, never main
        run: |
          git fetch origin chatgpt
          test "$(git rev-parse origin/chatgpt)" = "$GITHUB_SHA"
          git rm .github/personal-daily-part11.bin .github/personal-daily-part12.bin .github/personal-daily-part13.bin .github/personal-daily-part2.bin .github/personal-daily-part3.bin
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat: isolate ordinary-user daily updates, schedules and datasets"
          git push origin HEAD:refs/heads/chatgpt
          git rev-parse HEAD > "$RUNNER_TEMP/REVISION.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
          echo "Published tested source $(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-personal-daily-source
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/REVISION.txt
          if-no-files-found: error
          retention-days: 3
