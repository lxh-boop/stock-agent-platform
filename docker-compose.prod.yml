name: stock_prod

# Linux 服务器生产部署（腾讯云轻量 4C4G）。
# 启动：docker compose -f docker-compose.prod.yml --env-file deploy/server.env up -d --build
# 与开发版差异：
#   - Neo4j 并入同一 compose 网络（bolt://neo4j:7687），内存调低（heap 256m + pagecache 256m）
#   - 各服务设置 mem_limit，防止单容器吃光 4G 内存
#   - 数据库 / Neo4j / API 端口不对外发布，只暴露前端 3000（nginx 反代 /api/）
#   - 数据库密码走环境变量（Linux 服务器无 Windows secret 文件）

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_daily_app
      POSTGRES_USER: stock_app
      POSTGRES_PASSWORD: ${STOCK_POSTGRES_PASSWORD:?STOCK_POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_app -d stock_daily_app"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    mem_limit: 512m

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 256m
      TZ: Asia/Shanghai
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    stop_grace_period: 30s
    mem_limit: 900m

  api:
    build:
      context: .
      dockerfile: Dockerfile.compose
      target: api
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      AGENT_API_HOST: 0.0.0.0
      AGENT_API_PORT: "8010"
      STOCK_APP_DEPLOYMENT_MODE: compose-react
      STOCK_APP_ENV: ${STOCK_APP_ENV:-production}
      STOCK_APP_READINESS_CACHE_SECONDS: "${STOCK_APP_READINESS_CACHE_SECONDS:-5}"
      STOCK_APP_RUNTIME_SCHEDULER_ENABLED: "${STOCK_APP_RUNTIME_SCHEDULER_ENABLED:-1}"
      TZ: Asia/Shanghai
      STOCK_AGENT_RECOVER_INTERRUPTED_ON_START: "1"
      STOCK_POSTGRES_HOST: postgres
      STOCK_POSTGRES_PORT: "5432"
      STOCK_POSTGRES_DB: stock_daily_app
      STOCK_POSTGRES_USER: stock_app
      STOCK_POSTGRES_PASSWORD: ${STOCK_POSTGRES_PASSWORD}
      STOCK_POSTGRES_SCHEMA: stock_app
      STOCK_POSTGRES_RUNTIME_SCHEMA: stock_runtime
      STOCK_AGENT_MAX_CONCURRENT_TASKS: "${STOCK_AGENT_MAX_CONCURRENT_TASKS:-4}"
      STOCK_AGENT_CORS_ORIGINS: "${STOCK_AGENT_CORS_ORIGINS:-http://localhost:3000}"
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      QLIB_PROVIDER_URI: /app/data/qlib
      PYTHONUNBUFFERED: "1"
      AGENT_FLOW_TRACE: "${AGENT_FLOW_TRACE:-0}"
      AGENT_CONSOLE_TRACE: "0"
    volumes:
      # .dockerignore 排除了 data/ models/，镜像里没有，必须挂载（随 git 仓库带上服务器）
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./models
        target: /app/models
      # 运行期产物挂到宿主机，容器重建不丢
      - type: bind
        source: ./runtime_data/outputs
        target: /app/outputs
      - type: bind
        source: ./runtime_data/logs
        target: /app/logs
      - type: bind
        source: ./runtime_data/llm_prompt_dumps
        target: /app_runtime/llm_prompt_dumps
      - type: bind
        source: ./runtime_data/agent_runs
        target: /app_run_logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8010/api/v1/readiness', timeout=5)); assert p.get('success') and (p.get('data') or {}).get('status') == 'ready'"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 90s
    stop_grace_period: 30s
    mem_limit: 2560m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STOCK_APP_WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 10s
    mem_limit: 128m

volumes:
  postgres_data: {name: stock_prod_postgres}
  neo4j_data: {name: stock_prod_neo4j_data}
  neo4j_logs: {name: stock_prod_neo4j_logs}
